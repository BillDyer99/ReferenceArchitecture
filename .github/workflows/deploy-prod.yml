name: Deploy — Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy (e.g. v0.1.42). Leave empty to use the latest pre-release (normal promotion).'
        required: false
        type: string

permissions:
  contents: write   # update release pre-release flag
  id-token: write   # OIDC for Azure

jobs:
  find-version:
    name: Find version to deploy
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      version: ${{ steps.find.outputs.version }}
    steps:
      - name: Find version
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG=$(gh release list \
              --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease == true)] | first | .tagName')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No version specified and no pre-release found. Push to development first."
            exit 1
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "Deploying: ${TAG}"

  deploy:
    name: Deploy → Prod
    needs: find-version
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download API artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download ${{ needs.find-version.outputs.tag }} \
            --pattern "api-*.zip"

      - name: Download and unzip web artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download ${{ needs.find-version.outputs.tag }} \
            --pattern "web-*.zip"
          mkdir -p web/dist
          unzip web-${{ needs.find-version.outputs.version }}.zip -d web/dist

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-ref-arch-api-prd
          package: api-${{ needs.find-version.outputs.version }}.zip

      - name: Deploy web to SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'upload'
          app_location: '/web/dist'
          api_location: ''
          output_location: ''
          skip_app_build: true

      - name: Mark release as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit ${{ needs.find-version.outputs.tag }} --prerelease=false

      - name: Health check
        run: |
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://app-ref-arch-api-prd.azurewebsites.net/health)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — waiting 10s"
            sleep 10
          done
          echo "::error::Health check failed after 2 minutes. If schema is out of date, run the migrate-prod workflow."
          exit 1
