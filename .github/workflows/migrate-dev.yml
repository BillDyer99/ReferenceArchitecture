name: Migrate DB — Dev

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    name: Run migrations — Dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Restore
        run: dotnet restore
        working-directory: ./api

      - name: Build
        run: dotnet build --configuration Release --no-restore
        working-directory: ./api

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get connection string from Key Vault
        run: |
          CONN_STR=$(az keyvault secret show \
            --vault-name kv-refarch-bd99-dev \
            --name SqlConnectionString \
            --query value -o tsv)
          echo "::add-mask::$CONN_STR"
          echo "ConnectionStrings__DefaultConnection=$CONN_STR" >> $GITHUB_ENV

      - name: Run migrations
        run: dotnet ef database update --configuration Release --no-build
        working-directory: ./api
