name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            api:
              - 'api/**'
              - '.github/workflows/ci.yml'

  web-build-and-deploy:
    name: Web — Build and Deploy
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.web == 'true' &&
      (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build and Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/web'
          api_location: ''
          output_location: 'dist'
          azure_static_web_apps_api_token: ''
        env:
          IS_STATIC_EXPORT: false

  web-close-pr:
    name: Web — Close PR (cleanup preview)
    needs: detect-changes
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Close PR cleanup
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_GRASS_0F1CFB90F }}
          action: 'close'

  api-build-and-deploy:
    name: API — Build and Deploy
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.api == 'true' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./api

      - name: Build
        run: dotnet build --configuration Release --no-restore
        working-directory: ./api

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
        working-directory: ./api
        if: hashFiles('api/**/*Tests.csproj') != ''

      - name: Publish
        run: dotnet publish --configuration Release --no-build --output ./publish
        working-directory: ./api

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: billdyer99-api-centralus-01
          package: ./api/publish

  api-build-only:
    name: API — Build (PR validation)
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.api == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./api

      - name: Build
        run: dotnet build --configuration Release --no-restore
        working-directory: ./api

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
        working-directory: ./api
        if: hashFiles('api/**/*Tests.csproj') != ''

  ci-success:
    name: CI Success
    needs: [detect-changes, web-build-and-deploy, web-close-pr, api-build-and-deploy, api-build-only]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          # Collect results of all needed jobs
          declare -A results
          results[detect-changes]="${{ needs.detect-changes.result }}"
          results[web-build-and-deploy]="${{ needs.web-build-and-deploy.result }}"
          results[web-close-pr]="${{ needs.web-close-pr.result }}"
          results[api-build-and-deploy]="${{ needs.api-build-and-deploy.result }}"
          results[api-build-only]="${{ needs.api-build-only.result }}"

          echo "Job results:"
          for job in "${!results[@]}"; do
            echo "  $job: ${results[$job]}"
          done

          # Acceptable conclusions: success, skipped
          # Unacceptable: failure, cancelled
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::Job '$job' did not succeed (result: $result)"
              exit 1
            fi
          done

          echo "All required jobs completed successfully."