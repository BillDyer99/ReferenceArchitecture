name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - development
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
            api:
              - 'api/**'

  # PRs targeting development get a live preview on the dev SWA.
  # PRs targeting main get a build-only validation (no deploy).
  web-build-and-preview:
    name: Web — Build and Preview (dev PR)
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.web == 'true' &&
      github.base_ref == 'development' &&
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build
        working-directory: ./web
        env:
          VITE_API_BASE_URL: https://app-ref-arch-api-dev.azurewebsites.net
        run: npm run build

      - name: Deploy PR preview to dev SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/web/dist'
          api_location: ''
          output_location: ''
          skip_app_build: true

  web-build-validate:
    name: Web — Build (main PR)
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.web == 'true' &&
      github.base_ref == 'main' &&
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build
        working-directory: ./web
        env:
          VITE_API_BASE_URL: https://app-ref-arch-api-prd.azurewebsites.net
        run: npm run build

  web-close-pr:
    name: Web — Close PR preview
    if: github.event.action == 'closed' && github.base_ref == 'development'
    runs-on: ubuntu-latest
    steps:
      - name: Close PR preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'

  api-build:
    name: API — Build
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.api == 'true' &&
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore
        working-directory: ./api

      - name: Build
        run: dotnet build --configuration Release --no-restore
        working-directory: ./api

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
        working-directory: ./api
        if: hashFiles('api/**/*Tests.csproj') != ''

  ci-success:
    name: CI Success
    needs: [detect-changes, web-build-and-preview, web-build-validate, web-close-pr, api-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          declare -A results
          results[detect-changes]="${{ needs.detect-changes.result }}"
          results[web-build-and-preview]="${{ needs.web-build-and-preview.result }}"
          results[web-build-validate]="${{ needs.web-build-validate.result }}"
          results[web-close-pr]="${{ needs.web-close-pr.result }}"
          results[api-build]="${{ needs.api-build.result }}"

          echo "Job results:"
          for job in "${!results[@]}"; do
            echo "  $job: ${results[$job]}"
          done

          for job in "${!results[@]}"; do
            result="${results[$job]}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::Job '$job' did not succeed (result: $result)"
              exit 1
            fi
          done

          echo "All required jobs completed successfully."
